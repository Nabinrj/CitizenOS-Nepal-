name: CitizenOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: citizenos
          POSTGRES_PASSWORD: citizenos
          POSTGRES_DB: citizenos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citizenos -d citizenos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://citizenos:citizenos@localhost:5432/citizenos?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @citizenos/database generate
      - run: pnpm --filter @citizenos/database migrate
      - run: pnpm db:seed
      - run: pnpm --filter @citizenos/api build
      - run: pnpm --filter @citizenos/citizen-web build
      - run: pnpm --filter @citizenos/agency-web build
